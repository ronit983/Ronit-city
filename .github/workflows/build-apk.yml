
name: Build RONIT CITY APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract game project
        run: |
          unzip -q RONIT_CITY_OPEN_WORLD_PHONE_BUILD.zip -d source
          cd source/RONIT_CITY
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RONIT-CITY-APK
          path: source/RONIT_CITY/app/build/outputs/apk/debug/app-debug.apk
